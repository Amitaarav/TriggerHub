services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.fe
    #   args:
    #     NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    command: sh -c "npm install && npm run dev"
    depends_on:
      primbackend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - frontend-net
      - backend-net

  primbackend:
    ports:
      - "4000:4000"
    build:
      context: ./primBackend
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    # entrypoint: ["sh", "/usr/local/bin/entrypoint.sh"]
    # command: ["node", "dist/index.js"]
    volumes:
      - ./primBackend:/app
      - primbackend_node_modules:/app/node_modules
    command: sh -c "npm install && npx prisma generate && npm run dev"
    # volumes:
    #   - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend-net
      - data-net

  processor:
    build:
      context: ./processor
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    # entrypoint: ["sh", "/usr/local/bin/entrypoint.sh"]
    # command: ["node", "dist/index.js"]
    volumes:
      - ./processor:/app
      - processor_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BROKERS: kafka:9092
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - data-net

  worker:
    build:
      context: ./worker
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    # entrypoint: ["sh", "/usr/local/bin/entrypoint.sh"]
    volumes:
      - ./worker:/app
      - worker_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    # volumes:
    # - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BROKERS: kafka:9092
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - data-net

  hooks:
    build:
      context: ./hooks
      dockerfile: ../docker/Dockerfile.backend
    restart: unless-stopped
    # entrypoint: ["sh", "/usr/local/bin/entrypoint.sh"]
    volumes:
      - ./hooks:/app
      - hooks_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    # volumes:
    #   - ./docker/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - backend-net
      - data-net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data-net

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - data-net

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    # entrypoint: ["/bin/sh", "-c"]
    restart: "no"
    command: >
      "
      echo 'Creating topics...';

      kafka-topics.sh --create \
        --topic zap-events \
        --partitions 3 \
        --replication-factor 1 \
        --if-not-exists \
        --bootstrap-server kafka:9092;

      echo 'Topics created successfully';
      "
    networks:
      - data-net

volumes:
  db_data:
  kafka_data:
  frontend_node_modules:
  primbackend_node_modules:
  hooks_node_modules:
  processor_node_modules:
  worker_node_modules:

networks:
  frontend-net:
  backend-net:
  data-net: